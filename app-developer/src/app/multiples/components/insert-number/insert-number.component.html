<ion-card>
  <ion-card-header>
    <ion-card-title>Ingresa tu número</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <form (ngSubmit)="emitResult()">
      <ion-item>
        <ion-input
          [(ngModel)]="data"
          name="data"
          placeholder="0"
          type="number"
          required
        ></ion-input>
      </ion-item>
      <ion-button
        shape="round"
        [disabled]="data === null || undefined"
        type="submit"
      >
        Ver Resultado
      </ion-button>
    </form>
  </ion-card-content>
</ion-card>
