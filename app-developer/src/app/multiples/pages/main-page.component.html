<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-button color="medium" (click)="logoutSecion()">
      Cerrar seción
    </ion-button>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <div class="centered-container">
      <ion-card>
        <ion-card-header>
          <ion-card-header>
            <ion-card-title>Ingresa tu número</ion-card-title>
          </ion-card-header>
          <app-insert-number (results)="results($event)"></app-insert-number>
        </ion-card-header>
        <ion-card-content>
          <app-show-result [listNumbers]="listNumbers"></app-show-result>
        </ion-card-content>
      </ion-card>
    </div>
  </ion-content>
</div>
