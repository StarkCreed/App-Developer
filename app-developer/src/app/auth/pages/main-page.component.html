<div class="page-container">
  <ion-card color="light">
    <ion-card-header>
      <ion-card-title>Iniciar sesión</ion-card-title>
      <ion-card-subtitle>Accede a tu cuenta para continuar</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-button color="primary" (click)="loginWithGoogle()">
        <img
          src="assets/icon/google.png"
          alt="Google Logo"
          style="width: 20px; margin-right: 8px"
        />
        Iniciar sesión con Google
      </ion-button>
    </ion-card-content>
  </ion-card>
</div>
